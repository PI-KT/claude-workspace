<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김수민 | 포트폴리오</title>
  <meta name="description" content="B2B SaaS와 DTC 브랜드에서 퍼포먼스 마케팅과 자동화를 이끈 마케터 김수민의 포트폴리오">
  <script>
    // 저장된 모드를 먼저 적용해 화면이 깜빡이지 않게 함 (기본값: 다크)
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
